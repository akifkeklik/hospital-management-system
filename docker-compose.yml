version: '3.8'

services:
  mysql:
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hospitaldb
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me-local-only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/hospitaldb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-change-me-local-only}
      - DB_DRIVER=${DB_DRIVER:-com.mysql.cj.jdbc.Driver}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me-local-only}
      - JWT_SECRET=${JWT_SECRET:-this-is-a-dummy-jwt-secret-for-local-dev-only-min-32-chars}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-36000000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy-gemini-key}
      - GEMINI_API_URL=${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
      - MAIL_FROM=${MAIL_FROM:-onboarding@resend.dev}
      - PASSWORD_RESET_EMAIL_ENABLED=${PASSWORD_RESET_EMAIL_ENABLED:-false}
      - PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES=${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-30}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - DDL_AUTO=${DDL_AUTO:-update}
      - SHOW_SQL=${SHOW_SQL:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-Lax}
      - RATE_LIMIT_AUTH_CAPACITY=${RATE_LIMIT_AUTH_CAPACITY:-100}
      - RATE_LIMIT_AUTH_MINUTES=${RATE_LIMIT_AUTH_MINUTES:-1}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mysql_data:
