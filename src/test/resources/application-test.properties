# Test profile — In-memory H2 database (no external DB required)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.locations=classpath:db/migration/mysql

# Test-specific dummy JWT secret (must be at least 32 chars)
jwt.secret=test_dummy_secret_key_that_is_at_least_32_characters_long
cors.allowed-origins=http://localhost:3000
admin.password=test_admin_password

# --- MAIL CONFIGURATION (Dummy for Tests) ---
spring.mail.host=localhost
spring.mail.port=2525
management.health.mail.enabled=false
