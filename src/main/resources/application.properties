spring.application.name=Hospital Appointment System

# --- DATABASE ---
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA (Hibernate) ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# --- FLYWAY ---
spring.flyway.locations=classpath:db/migration/{vendor}

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- SERVER ---
server.port=8080
server.forward-headers-strategy=framework

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000000}

# --- SECURITY ---
cookie.secure=${COOKIE_SECURE:true}
cookie.sameSite=${COOKIE_SAMESITE:None}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
rate-limit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:10}
rate-limit.auth.minutes=${RATE_LIMIT_AUTH_MINUTES:1}

# --- LOGGING ---
logging.pattern.console=[%X{traceId}] [%thread] %-5level %logger - %msg%n
logging.level.com.hospital.appointmentsystem=INFO

# --- AI (Google Gemini) ---
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}

# --- ACTUATOR & METRICS ---
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=true
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=hospital-appointment-system

# --- PAGINATION ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100



# --- PASSWORD RESET ---
password.reset.email.from=${MAIL_FROM:onboarding@resend.dev}
password.reset.email.enabled=${PASSWORD_RESET_EMAIL_ENABLED:true}
password.reset.token.expiration.minutes=${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
frontend.base.url=${FRONTEND_BASE_URL:http://localhost:3000}
